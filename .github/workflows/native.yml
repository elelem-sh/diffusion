name: Native

on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/native.yml"
      - ".gitmodules"
      - "*.gemspec"
      - "ext/**"
      - "lib/**"
      - "vendor/**"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, backend: cpu, force: cpu }
          - { os: macos-latest, backend: metal }
          - { os: macos-15-intel, backend: cpu, force: cpu }
          - { os: macos-15-intel, backend: vulkan, force: vulkan, brew: shaderc spirv-headers vulkan-headers vulkan-loader }
    env:
      BACKEND: ${{ matrix.backend }}
      ELELEM_SD_BACKEND: ${{ matrix.force }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - run: git -C vendor/stable-diffusion.cpp submodule update --init --depth 1 ggml
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
      - if: matrix.brew
        run: brew install ${{ matrix.brew }}
      - run: gem build elelem-diffusion.gemspec --output elelem-diffusion.gem
      - run: gem install elelem-diffusion.gem
      - working-directory: ${{ runner.temp }}
        run: |
          ruby -relelem/diffusion -e '
            backend = File.read(File.join(Elelem::Diffusion::NATIVE, "backend"))
            abort "built #{backend}, expected #{ENV.fetch("BACKEND")}" unless backend == ENV.fetch("BACKEND")
            puts backend, Elelem::Diffusion.functions.keys
          '
